name: MASTER SURGERY PRO (A-ONLY)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Cloud Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc python3

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Sync Main OrangeFox Source
        run: |
          mkdir -p ~/orangefox_workspace
          cd ~/orangefox_workspace
          git config --global user.name "TechnicalPrince"
          git config --global user.email "technicalprince@example.com"
          repo init -u https://github.com/OrangeFox/Manifest.git -b fox_11.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Your Imported Device Tree
        run: |
          cd ~/orangefox_workspace
          # Yahan ${{ github.repository_owner }} aapke account se tree uthayega
          git clone https://github.com/${{ github.repository_owner }}/device_xiaomi_jasmine_sprout.git -b fox_9.0 device/xiaomi/jasmine_sprout

      - name: Apply All Master Hacks
        run: |
          cd ~/orangefox_workspace/device/xiaomi/jasmine_sprout
          sed -i 's/AB_OTA_UPDATER := true/AB_OTA_UPDATER := false/g' BoardConfig.mk || true
          echo "OF_AB_DEVICE := 0" >> BoardConfig.mk
          find . -type f -name "*.fstab" -o -name "*.flags" | xargs sed -i 's/,slotselect//g' || true
          find . -type f -name "*.fstab" -o -name "*.flags" | xargs sed -i '/external_sd/d' || true
          find . -type f -name "*.fstab" -o -name "*.flags" | xargs sed -i '/sdcard1/d' || true
          cat <<EOF >> system.prop
          ro.orangefox.force_mtp=1
          ro.orangefox.disable_shot_check=1
          persist.sys.usb.config=mtp,adb
          ro.build.version.release=11
          ro.build.version.sdk=30
          EOF

      - name: Compile Custom Recovery
        run: |
          cd ~/orangefox_workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="A-Only_Special"
          export OF_MAINTAINER="TechnicalPrince"
          export FOX_R11=1
          source build/envsetup.sh
          lunch omni_jasmine_sprout-eng
          mka recoveryimage

      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Final-Pro
          path: ~/orangefox_workspace/out/target/product/jasmine_sprout/OrangeFox-*.zip
